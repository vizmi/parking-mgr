spring.application.name=parking-mgr
lots=10
# Points at local Redis by default (see docker-compose.yml); override with a real
# endpoint (credentials included in the URL) via the REDIS_URL env var in other environments.
redis.url=${REDIS_URL:redis://localhost:6379}
redis.empty.lots=${spring.application.name}|empty.lots
redis.filled.lots=${spring.application.name}|filled.lots
